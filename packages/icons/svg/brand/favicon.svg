<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none"><title>Data4Now</title><!-- d4n-allow-literal-color: a favicon is drawn by the browser chrome, outside our document, so it inherits nothing. currentColor would resolve to the browser's default text colour, not to ours, and var() has no scope to resolve against. Every value here is therefore explicit: plate d4n-color-surface-sunken dark, letterforms d4n-color-palette-neutral-50, wedge d4n-color-palette-magenta-400. This is the source of truth; scripts/render-favicon.mjs rasterises it, because Safari 17 does not render an SVG rel=icon and PRD 4.2 puts Safari 17 in scope. NOTE: no double hyphen may appear in this comment. XML forbids it, and an SVG parser rejects the whole asset. --><rect width="64" height="64" rx="14" fill="#0B1F38"/><path fill="#F4F6FA" d="M32 32 20.863 20.863a15.75 15.75 0 0 1 22.274 0Z"/><path fill="#E63558" d="M32 32H16.25a15.75 15.75 0 1 0 26.887-11.137Z"/></svg>
