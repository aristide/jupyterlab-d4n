  # ===========================================================================
  # DIALOG / TOAST BUTTON INTENTS
  # ===========================================================================
  # `accept` / `reject` / `warn` × `normal` / `hover` / `active`. Core does not
  # define any of the nine — every rule that reads them supplies a Material
  # fallback (`--md-blue-500`, `--md-grey-500`, `--md-red-700`) — so an unmapped
  # row here does not fall back to something neutral, it falls back to stock
  # Material, which is the one palette this project exists to remove.
  #
  # These are BUTTON INTENTS, so they are pointed at the Tier 3 `button.*` group
  # rather than at Tier 2 colour ramps. That is deliberate: core paints
  # `button.jp-mod-styled.jp-mod-accept` with these, and PRD §8.1 paints our own
  # buttons with `button.*`. Routing both through one Tier 3 group is what keeps
  # a core dialog's OK button identical to a button we render ourselves — map
  # these to `color.action.*` instead and the two drift apart the moment §8.1
  # changes a hover step.
  #
  # THE NAME/MEANING SPLIT — `warn`: core reads this variable in two components
  # with two different meanings. `button.jp-mod-styled.jp-mod-warn` falls back to
  # `--jp-error-color1` (it is the DESTRUCTIVE confirm — "Delete", "Shut Down
  # Kernel", "Restart and Clear Outputs"), while `.jp-toast-button.jp-mod-warn`
  # falls back to `--jp-warn-color1` (an actual amber warning in a notification).
  # We take the DIALOG meaning as dominant: destructive dialog confirms are far
  # more frequent and far more consequential than warn-level toast actions, and
  # a destructive button that is amber instead of magenta understates the
  # consequence — the failure that matters. The toast's warn button is corrected
  # back to warning amber in ui-overrides, where it can be selected on its own.
  - jp: --jp-accept-color-normal
    token: button.primary.bg
    rationale: "The affirmative dialog/toast button. Teal (button.primary.bg → color.action.default), NOT the navy brand: PRD §5.1 splits identity from interaction, and a dialog's confirm is an interaction. Navy would also collide with the top panel behind a non-modal toast."
  - jp: --jp-accept-color-hover
    token: button.primary.bgHover
    rationale: "Hover step of the same primary button, so a core dialog button and a §8.1 button move together on hover."
  - jp: --jp-accept-color-active
    token: button.primary.bgActive
    rationale: "Pressed step. CAVEAT worth carrying: core also reuses this variable as `outline-color` on `.lm-MenuBar:focus-visible` and on `button.jp-mod-accept:focus-visible` — a pressed-button fill doing duty as a focus ring. On the always-dark top panel (D-007) a pressed teal ring is weak, so ui-overrides re-points the menu-bar focus ring at focusRing.color; distorting this row to suit the menu bar would break the button it is actually named for."
  - jp: --jp-reject-color-normal
    token: button.secondary.bg
    rationale: "Cancel / dismiss. The SECONDARY variant, not a grey literal: 'reject' in core means 'the other button', not 'a negative action' — Cancel is neutral, and the destructive path is `warn`. Core's `--md-grey-500` fallback is a mid grey that fails 4.5:1 against white label text in light mode; our secondary button is a bordered surface with primary-text-coloured label, which passes in both modes."
  - jp: --jp-reject-color-hover
    token: button.secondary.bgHover
    rationale: "Hover step of the secondary button."
  - jp: --jp-reject-color-active
    token: button.secondary.bgActive
    rationale: "Pressed step of the secondary button."
  - jp: --jp-warn-color-normal
    token: button.danger.bg
    rationale: "The destructive confirm — see the name/meaning note above. Magenta (color.danger.default), the logo's pie-wedge colour, and the same token the error output block and the dead-kernel indicator use, so 'this destroys something' is one colour across the product."
  - jp: --jp-warn-color-hover
    token: button.danger.bgHover
    rationale: "Hover step of the danger button."
  - jp: --jp-warn-color-active
    token: button.danger.bgActive
    rationale: "Pressed step of the danger button."

  # ===========================================================================
  # SWITCH (settings editor, notification centre)
  # ===========================================================================
  # Core defines neither; both rules carry a fallback. The thumb is drawn with
  # --jp-ui-inverse-font-color1 (a light chip in both modes), so both track
  # colours below are chosen to keep a light thumb legible on them.
  - jp: --jp-switch-color
    token: color.border.default
    rationale: "The OFF track. A border token, not a surface token, even though it is a background: the track is a 16px pill that has to read as a filled outline against surface.raised, and every surface.* step is by construction close to the panel it sits on. color.border.default is the same choice core makes (its fallback is --jp-border-color1) and it is the only neutral in the system guaranteed to separate from both raised and canvas in both modes."
  - jp: --jp-switch-true-position-color
    token: color.action.default
    rationale: "The ON track. Core falls back to --jp-warn-color0 — amber — which says 'careful' about a setting the user just switched on. An engaged toggle is a SELECTED interactive state, so it takes the interaction teal, the same token as the active tab indicator and the focused-cell border. State is still legible without colour (the thumb slides), so this satisfies A7 on position alone."

  # ===========================================================================
  # COMPLETER TYPE BADGES
  # ===========================================================================
  # PRD §6.4 lists `.jp-Completer` type badges as T2 — token-reachable, so they
  # get mapped rather than excluded. Eleven indices, and the index is NOT
  # arbitrary: @jupyterlab/completer orders its type list with
  # KNOWN_TYPES = ['function', 'instance', 'class', 'module', 'keyword'] first,
  # so indices 1–5 are those five in that order, 6–10 are whatever extra types
  # the kernel returns (order not stable across kernels), and 0 is "no type".
  #
  # WHY THE SYNTAX RAMP AND NOT AN ACCENT SET: the badge is a solid swatch with
  # no text on it, sitting next to `.jp-Completer-typeExtended`, which prints the
  # type NAME in text — so colour is never the sole carrier here (A7 is already
  # satisfied) and the swatch's only job is recognition. Colouring it with the
  # colour the CM6 HighlightStyle will paint the accepted token in makes that
  # recognition transfer to the editor: the swatch beside `def` is the same hue
  # the function name turns once inserted. color.icon.contrast0–4 was the
  # alternative and was rejected — it is five slots for eleven indices, and it
  # carries no relationship to what the completion IS.
  #
  # The ten hues below were checked for mutual distinctness in BOTH modes on a
  # running build. That constraint is what excludes color.syntax.operator and
  # color.syntax.invalid: both resolve to the same magenta as color.syntax.meta,
  # so either would have made two badges identical. `invalid` is doubly wrong
  # here anyway — it means "this is broken", not "this is a category".
  - jp: --jp-completer-type-background0
    token: transparent
    literal: true
    rationale: "Index 0 is 'no type reported', not a category. A literal `transparent` — matching core — because painting a swatch here would assert a classification the kernel did not make, and every remaining hue is spoken for by a real type."
  - jp: --jp-completer-type-background1
    token: color.syntax.function
    rationale: "Index 1 is always `function` (first entry of KNOWN_TYPES). Same token the editor paints a function name with."
  - jp: --jp-completer-type-background2
    token: color.syntax.name
    rationale: "Index 2 is always `instance` — a bound identifier, which is exactly what color.syntax.name covers. Not color.syntax.property: an instance in a completion list is usually a module-level or local binding, not an attribute access."
  - jp: --jp-completer-type-background3
    token: color.syntax.type
    rationale: "Index 3 is always `class`. color.syntax.type is the ramp's class/type-annotation colour, so the badge and the annotation `x: MyClass` agree."
  - jp: --jp-completer-type-background4
    token: color.syntax.meta
    rationale: "Index 4 is always `module`. meta carries decorators, pragmas and import-level constructs — the closest thing the ramp has to 'namespace'. type was the neighbouring candidate and is already spent on `class`, which is the distinction that matters most in a Python completion list."
  - jp: --jp-completer-type-background5
    token: color.syntax.keyword
    rationale: "Index 5 is always `keyword`. Direct match."
  - jp: --jp-completer-type-background6
    token: color.syntax.string
    rationale: "Indices 6–10 are kernel-defined extra types in an order that is not stable across kernels, so no fixed meaning can be assigned. The requirement collapses to 'mutually distinct, and distinct from 1–5' — this is the remaining syntax hue set, assigned in ramp order."
  - jp: --jp-completer-type-background7
    token: color.syntax.number
    rationale: "Kernel-defined extra type — see index 6."
  - jp: --jp-completer-type-background8
    token: color.syntax.property
    rationale: "Kernel-defined extra type — see index 6."
  - jp: --jp-completer-type-background9
    token: color.syntax.regexp
    rationale: "Kernel-defined extra type — see index 6."
  - jp: --jp-completer-type-background10
    token: color.syntax.comment
    rationale: "Kernel-defined extra type, and the last distinct hue the ramp has left — the neutral one. Using the comment colour as a BACKGROUND chip does not inherit its 'recede' intent: that intent is about text weight, and this swatch carries no text. An eleventh type falls back to index 0 in core, which is why the ramp stops here."

  # ===========================================================================
  # KEYBOARD SHORTCUTS EDITOR
  # ===========================================================================
  - jp: --jp-shortcuts-button-background
    token: color.surface.sunken
    rationale: "The key-cap chips in the shortcut editor (`.jp-Shortcuts-Plus`, `.jp-mod-selected-InputText`). Sunken, not raised: a key cap is an inset well the user types into, and the settings panel it sits on is already surface.raised — raised-on-raised is invisible."
  - jp: --jp-shortcuts-button-hover-background
    token: color.surface.hover
    rationale: "Hover on the same chips. The standard hover step, so a key cap behaves like every other hoverable row in the chrome rather than inventing a local convention."

  # ===========================================================================
  # LUMINO DATAGRID (CSV viewer, debugger variables grid)
  # ===========================================================================
  # PRD Appendix B: the grid body is canvas-rendered and reached by the T4
  # bridge, not by CSS. These two variables still matter — `buildGridStyle()`
  # reads them off `getComputedStyle(document.body)` to build the TextRenderer
  # font, and the debugger's colour-palette legend reads them directly in CSS.
  # Mapping them is what stops the bridge from measuring a stock value.
  - jp: --jp-datagrid-font-family
    token: font.family.mono
    rationale: "Mono, not font.family.content (core's fallback). Grid cells hold data — numbers, ids, timestamps — and PRD §8.6.2 already specifies mono for variable values in the tree view; using a proportional face here would break decimal alignment down a numeric column and make the same value look different in the two debugger views."
  - jp: --jp-datagrid-font-size
    token: font.size.codeCompact
    rationale: "12px. The compact step of the CODE ramp rather than font.size.ui.xs (11px, also 12-ish): this text is set in font.family.mono, and a size taken from the UI ramp would drift away from the mono ramp the moment the two are re-tuned. 12px also matches core's own hardcoded fallback, so row heights do not shift under third-party grid extensions that never read the variable."

  # ===========================================================================
  # FILE BROWSER, FILE EDITOR, FLAT BUTTONS
  # ===========================================================================
  - jp: --jp-dirlisting-padding-width
    token: space.3
    rationale: "12px — the file browser row's horizontal inset, and it must equal the notebook and console padding (both space.3) or the file browser's left edge steps away from the document beside it."
  - jp: --jp-editor-scroll-padding
    token: "calc(100% - var(--jp-code-font-size) * var(--jp-code-line-height) - var(--jp-code-padding) * 2)"
    literal: true
    rationale: "The file editor's scroll-past-end padding. Core never defines it, so unmapped it resolves to nothing and the whole `padding-bottom` declaration is dropped — scroll-past-end silently does nothing. Same computed form as --jp-notebook-scroll-padding (one line stays visible at the bottom) minus the --jp-cell-padding term, because a file editor has no cell box around it."
  - jp: --jp-flat-button-height
    token: button.heightCompact
    rationale: "24px min-height for core's flat text buttons (`.jp-TrimmedOutputs-button`, 'Show more outputs'). The COMPACT control height, not button.height: these sit inside an output area between cells, where a 32px control pushes the output stream around."
  - jp: --jp-flat-button-padding
    token: "var(--d4n-space-2) var(--d4n-space-3)"
    literal: true
    rationale: "A two-value shorthand no single space token expresses, so a literal — but built from tokens, not from 8px/12px numerals. Same 8/12 values core ships, which are already on our 4px grid; the change is that they now track the grid if it moves."
  - jp: --jp-add-tag-extra-width
    token: space.2
    rationale: "8px. The notebook tag editor measures the typed text in a throwaway node and sets the input width to `calc(<measured>px + this)`, so it is the slack that stops the caret sitting flush against the border. space.2 rather than space.1: at 4px the caret visually touches the 1px border on the tag chip's radius.sm corner."

  # ===========================================================================
  # MISC
  # ===========================================================================
  - jp: --jp-vega-background
    token: color.surface.canvas
    rationale: "The plate behind a Vega chart. Notebook output CONTENT is an explicit non-goal (PRD §3.2), but the plate the chart is drawn on is chrome, and leaving it stock white puts a white rectangle in the middle of a dark notebook."
