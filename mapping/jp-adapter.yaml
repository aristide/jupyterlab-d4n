# =============================================================================
# TIER 4 — the --jp-* adapter. THE CONTRACT.
# =============================================================================
#
# This file is the one place `--jp-*` names are allowed to appear (PRD §5.2
# rule 1). packages/tokens/build.mjs turns it into
# packages/tokens/style/generated/jp-adapter.css; nobody hand-edits that output.
#
# WHY THIS FILE IS THE HIGHEST-LEVERAGE ARTIFACT IN THE PROJECT (PRD §1.1):
# JupyterLab's variables are POSITIONAL — `--jp-layout-color0..4` is a lightness
# ramp, `--jp-border-color0..3` is a contrast ramp. A design system speaks in
# `surface.canvas`, `border.subtle`. Mapping one onto the other by intuition
# produces a UI that looks right on one screen and wrong on the next, because
# the same `--jp-layout-color2` means "sunken input background" in one core
# component and "hovered menu item" in another. Every row below is a reviewed
# decision, and `rationale` is REQUIRED — build.mjs fails on a row without one.
#
#
# SIGN-OFF — 2026-09-03, Aristide. TODO P0-10, the PRD §11 exit gate.
#
# 233 rows, every one carrying a rationale, plus 158 excluded variables with
# their owner named. The completeness check in build.mjs was active and green
# at sign-off: every `--jp-*` the running JupyterLab reads is mapped here,
# excluded, or `--jp-private-*`.
#
# HOW IT WAS REVIEWED, stated plainly so a later reader does not over-read it.
# Design and Engineering are held by one person on this project. Sections 1 to 3
# (ELEVATION, BORDERS, FOCUS RING — 19 rows) were read row by row. Sections 4 to
# 27 (214 rows) were accepted in bulk, after the reviewer was shown the two
# classes of row most likely to need argument:
#
#   * the 22 rows that pin a `literal:` value instead of pointing at a token,
#     including the three search-toggle opacities set to 1, which defeat core's
#     opacity-based state on purpose and hand the state to colour;
#   * the five rows whose rationale records a deliberate departure —
#     `--jp-elevation-z6`, `--jp-ui-font-color3`,
#     `--jp-content-link-visited-color`, `--jp-info-color1` and
#     `--jp-mirror-editor-comment-color`.
#
# This is one reviewer, not three, and it is not a line-by-line reading of all
# 233. Re-open any row on evidence rather than treating the gate as closed
# argument.
# REVIEW RULES
#   * Ordered by JupyterLab's own variables.css so a diff against an upstream
#     bump reads cleanly.
#   * `token:` must name a Tier 1 structural, Tier 2 semantic, or Tier 3
#     component token. build.mjs rejects unknown paths.
#   * `literal: true` means `token:` is a raw CSS value. Use it only where
#     JupyterLab wants a bare number/keyword that is not a design decision.
#   * Never map a `--jp-private-*` variable (build.mjs rejects it) and never map
#     a variable owned by a third-party extension — those live in compat-shim.
#
# STATUS: drafted against JupyterLab 4.5 from upstream's
# packages/theme-light-extension/style/variables.css, then CLOSED against a
# running JupyterLab 4.6.3 by the P0-03 audit
# (tests/galata/extract-jp-variables.mjs → mapping/jp-variables.manifest.json,
# 385 non-private variables). Completeness is now machine-verified: build.mjs
# FAILS on any manifest entry that is neither mapped below nor listed under
# `excluded:` (PRD AC5). Re-run the extractor on every JupyterLab bump —
# Appendix C step 3.
#
# NOTE ON THE MANIFEST: it is extracted from the target build with this
# extension INSTALLED, so it also contains variables our own compat-shim
# declares (the nbdime and ipywidgets sets). Those are excluded below with the
# owner named, not mapped — the adapter stays a contract with ONE upstream.

excluded:
  # PRD Appendix A — "Excluded from the mapping — do not touch".
  # Private, not public API; changes without notice between patch releases.
  # (build.mjs also refuses any --jp-private-* row outright.)
  - --jp-shadow-base-lightness
  - --jp-shadow-umbra-color
  - --jp-shadow-penumbra-color
  - --jp-shadow-ambient-color
  # Owned by ipywidgets, not by JupyterLab core. Handled in compat-shim so the
  # adapter stays a contract with ONE upstream (PRD §7.9, §10.4).
  - --jp-widgets-color
  - --jp-widgets-label-color
  - --jp-widgets-readout-color
  - --jp-widgets-slider-background
  - --jp-widgets-slider-active-handle-color
  - --jp-widgets-slider-handle-background-color
  - --jp-widgets-slider-handle-border-color
  - --jp-widgets-menu-item-height
  - --jp-widgets-container-padding
  - --jp-widgets-input-padding
  - --jp-widgets-input-background-color
  - --jp-widgets-input-border-color
  - --jp-widgets-input-focus-border-color
  - --jp-widgets-input-color
  # The geometry half of the same ipywidgets set. Same owner, same reason, and
  # they are all set explicitly in packages/compat-shim/style/vendor/ipywidgets.css
  # — the P0-03 manifest only lists them because that file is loaded in the
  # running build, not because JupyterLab core reads them.
  - --jp-widgets-border-width
  - --jp-widgets-disabled-opacity
  - --jp-widgets-font-size
  - --jp-widgets-horizontal-tab-height
  - --jp-widgets-horizontal-tab-top-border
  - --jp-widgets-inline-height
  - --jp-widgets-inline-margin
  - --jp-widgets-input-border-width
  - --jp-widgets-margin
  - --jp-widgets-slider-border-width
  # Owned by nbdime (loaded by jupyterlab-git for notebook diffs), not by
  # JupyterLab core — the `--jp-` prefix is nbdime borrowing a namespace it does
  # not own. Appendix A routes third-party `--jp-*` to compat-shim; these are set
  # in packages/compat-shim/style/vendor/jupyterlab-git.css, which is also where
  # the accompanying `.jp-git-diff-*` container rules live. Splitting the diff
  # across two files would mean an nbdime bump could silently half-apply.
  - --jp-diff-added-color
  - --jp-diff-added-text-color
  - --jp-diff-deleted-color
  - --jp-diff-deleted-text-color
  # Deliberately left at core's value: a pure timing knob with no visual
  # consequence, and overriding it would be us guessing at a performance
  # trade-off that is not a design decision.
  - --jp-notebook-render-timeout
  # ---------------------------------------------------------------------------
  # ICON ASSET URLs — NOT design tokens, and not a gap in the adapter.
  # ---------------------------------------------------------------------------
  # Every name below resolves to `url(data:image/svg+xml;base64,…)` on `:root`
  # — the raw SVG payload webpack inlined at build time. They are consumed by
  # exactly one kind of rule, `.jp-<Name>Icon { background-image: var(…) }`,
  # which is core's legacy CSS-background icon path; the LabIcon registry (the
  # path everything modern renders through) never reads them.
  #
  # There is no Tier 1–3 token that could go here. Tiers 1–3 hold colours,
  # sizes and durations; an inlined SVG document is an ASSET, and PRD §7.8
  # delivers assets by writing `LabIcon.resolve(name).svgstr`, not by setting a
  # variable. Mapping them would also defeat the icons' own theming: the shipped
  # SVGs fill with `jp-icon0`–`4` / `currentColor` (§7.8.4, I2), and those
  # classes only work when the SVG is INLINED in the DOM. A `background-image`
  # cannot be recoloured by CSS at all, which is why P0-04's manifest and the
  # `@d4n/icons` override plugin — not this file — own icon replacement.
  #
  # The colour variables that DO belong to icons (`--jp-icon-contrast-color0`–`4`,
  # `--jp-jupyter-icon-color`, `--jp-console-icon-*`, …) are mapped below.
  #
  # This list is deliberately explicit rather than a `--jp-icon-*` prefix rule:
  # an icon added upstream must fail the build so P0-04's manifest gets a new
  # row, and a prefix rule would swallow a newly-added icon COLOUR variable too.
  - --jp-icon-add
