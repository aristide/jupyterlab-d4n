  # ===========================================================================
  # LEGACY CodeMirror 5 VARIABLES
  # ===========================================================================
  # JupyterLab 4 moved to CodeMirror 6, and syntax highlighting now runs through
  # a real HighlightStyle registered on IEditorThemeRegistry (PRD §7.5, our
  # editor-theme package). These variables survive for compatibility and are
  # still read by a few third-party extensions and by rendered-markdown code
  # blocks. They are mapped to the SAME Tier 2 syntax tokens the HighlightStyle
  # uses, so a code span in markdown matches the editor beside it.
  - jp: --jp-mirror-editor-keyword-color
    token: color.syntax.keyword
    rationale: "Shared with the CM6 HighlightStyle tag `keyword`."
  - jp: --jp-mirror-editor-atom-color
    token: color.syntax.number
    rationale: "CM5 'atom' covers True/False/None, which our ramp treats as numeric literals."
  - jp: --jp-mirror-editor-number-color
    token: color.syntax.number
    rationale: "Numeric literals."
  - jp: --jp-mirror-editor-def-color
    token: color.syntax.function
    rationale: "CM5 'def' is a function/class definition name."
  - jp: --jp-mirror-editor-variable-color
    token: color.syntax.name
    rationale: "Plain identifiers."
  - jp: --jp-mirror-editor-variable-2-color
    token: color.syntax.property
    rationale: "CM5 'variable-2' is an attribute/property access."
  - jp: --jp-mirror-editor-variable-3-color
    token: color.syntax.type
    rationale: "CM5 'variable-3' is a type annotation."
  - jp: --jp-mirror-editor-punctuation-color
    token: color.syntax.name
    rationale: "Punctuation takes the plain-identifier colour, not a dimmer one — dimmed brackets make nested calls harder to parse, not easier."
  - jp: --jp-mirror-editor-property-color
    token: color.syntax.property
    rationale: "Object properties."
  - jp: --jp-mirror-editor-operator-color
    token: color.syntax.operator
    rationale: "Operators."
  - jp: --jp-mirror-editor-comment-color
    token: color.syntax.comment
    rationale: "Comments. The token most often left failing A4 in dark themes, because it is deliberately de-emphasised — audited explicitly."
  - jp: --jp-mirror-editor-string-color
    token: color.syntax.string
    rationale: "String literals."
  - jp: --jp-mirror-editor-string-2-color
    token: color.syntax.regexp
    rationale: "CM5 'string-2' is regex and template-literal content."
  - jp: --jp-mirror-editor-meta-color
    token: color.syntax.meta
    rationale: "Decorators, pragmas, shebangs."
  - jp: --jp-mirror-editor-qualifier-color
    token: color.syntax.name
    rationale: "Qualifiers take the plain-identifier colour."
  - jp: --jp-mirror-editor-builtin-color
    token: color.syntax.keyword
    rationale: "Builtins read as keywords in Python, which is the dominant kernel here."
  - jp: --jp-mirror-editor-bracket-color
    token: color.syntax.name
    rationale: "Brackets take the plain-identifier colour; matched-bracket emphasis is a CM6 decoration, not a token colour."
  - jp: --jp-mirror-editor-tag-color
    token: color.syntax.keyword
    rationale: "HTML/XML tags."
  - jp: --jp-mirror-editor-attribute-color
    token: color.syntax.property
    rationale: "HTML/XML attributes."
  - jp: --jp-mirror-editor-header-color
    token: color.syntax.heading
    rationale: "Markdown headings inside a code editor."
  - jp: --jp-mirror-editor-quote-color
    token: color.syntax.comment
    rationale: "Markdown blockquotes — same de-emphasis as comments."
  - jp: --jp-mirror-editor-link-color
    token: color.syntax.link
    rationale: "Markdown links."
  - jp: --jp-mirror-editor-error-color
    token: color.syntax.invalid
    rationale: "Syntax errors."
  - jp: --jp-mirror-editor-hr-color
